[project]
name = "image-video-voice-api"
version = "0.1.0"
description = "FastAPI backend for the image-to-video voice MVP."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "kokoro>=0.9.4",
    "numpy>=1.26.0",
    "openai>=1.84.0",
    "pydantic-settings>=2.4.0",
    "python-multipart>=0.0.9",
    "soundfile>=0.12.1",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
